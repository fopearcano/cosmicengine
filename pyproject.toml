[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cosmic_engine"
version = "0.0.0"
description = "Data-driven, physics-grounded, AI-assisted cosmic perception engine."
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24",
    "onnxruntime>=1.17",
]

[tool.setuptools.packages.find]
where = ["engine"]
