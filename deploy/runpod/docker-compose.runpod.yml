# Local emulation of a CosmicEngine RunPod deployment.
#
# Spins up: ray-head, two workers (ai + render), a viewer. All
# services share the same volume layout (/workspace/{data,models,
# outputs}) that the RunPod Dockerfiles assume.
#
# GPU support: uncomment the deploy.resources.reservations.devices
# block on services that need a GPU. Requires the NVIDIA Container
# Toolkit on the host. Without it the stack still works on CPU.

version: "3.9"

services:
  # ----------------------------------------------------------------
  # Ray head + CosmicRuntime API
  # ----------------------------------------------------------------
  ray-head:
    build:
      context: ../..
      dockerfile: deploy/runpod/docker/Dockerfile.runtime
    image: cosmic-engine/runtime:runpod
    hostname: ray-head
    container_name: cosmic-runpod-ray-head
    environment:
      COSMIC_ROLE: runtime
      COSMIC_RUNTIME_HOST: "0.0.0.0"
      COSMIC_RUNTIME_PORT: "8765"
      COSMIC_HEAD_IP: "0.0.0.0"
      COSMIC_HEAD_PORT: "6379"
      COSMIC_DATA_DIR: /workspace/data
      COSMIC_MODEL_DIR: /workspace/models
      COSMIC_OUTPUT_DIR: /workspace/outputs
      COSMIC_NODE_NAME: ray-head
    ports:
      - "8765:8765"   # CosmicRuntime API
      - "6379:6379"   # Ray GCS
      - "8265:8265"   # Ray dashboard
      - "10001:10001" # Ray client
    volumes:
      - ./data:/workspace/data
      - ./models:/workspace/models
      - ./outputs:/workspace/outputs

  # ----------------------------------------------------------------
  # AI worker (neural photon warp, density reconstruction)
  # ----------------------------------------------------------------
  worker-ai:
    build:
      context: ../..
      dockerfile: deploy/runpod/docker/Dockerfile.worker
    image: cosmic-engine/worker:runpod
    container_name: cosmic-runpod-worker-ai
    depends_on:
      - ray-head
    environment:
      COSMIC_ROLE: worker
      COSMIC_HEAD_IP: ray-head
      COSMIC_HEAD_PORT: "6379"
      COSMIC_RAY_ADDRESS: "ray-head:6379"
      COSMIC_DATA_DIR: /workspace/data
      COSMIC_MODEL_DIR: /workspace/models
      COSMIC_OUTPUT_DIR: /workspace/outputs
      COSMIC_NODE_NAME: worker-ai
      COSMIC_ENABLE_GPU: "false"
    volumes:
      - ./data:/workspace/data
      - ./models:/workspace/models
      - ./outputs:/workspace/outputs
    # Uncomment to expose a GPU (requires NVIDIA Container Toolkit):
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

  # ----------------------------------------------------------------
  # Render worker (Gaussian splatting / GPU rendering)
  # ----------------------------------------------------------------
  worker-render:
    build:
      context: ../..
      dockerfile: deploy/runpod/docker/Dockerfile.worker
    image: cosmic-engine/worker:runpod
    container_name: cosmic-runpod-worker-render
    depends_on:
      - ray-head
    environment:
      COSMIC_ROLE: worker
      COSMIC_HEAD_IP: ray-head
      COSMIC_HEAD_PORT: "6379"
      COSMIC_RAY_ADDRESS: "ray-head:6379"
      COSMIC_DATA_DIR: /workspace/data
      COSMIC_MODEL_DIR: /workspace/models
      COSMIC_OUTPUT_DIR: /workspace/outputs
      COSMIC_NODE_NAME: worker-render
      COSMIC_ENABLE_GPU: "false"
    volumes:
      - ./data:/workspace/data
      - ./models:/workspace/models
      - ./outputs:/workspace/outputs
    # See worker-ai above for the optional GPU reservation block.

  # ----------------------------------------------------------------
  # Dedicated runtime pod (opt-in profile). Useful when the head
  # pod should focus on Ray and a separate pod should serve the
  # CosmicRuntime API.
  # ----------------------------------------------------------------
  runtime:
    build:
      context: ../..
      dockerfile: deploy/runpod/docker/Dockerfile.runtime
    image: cosmic-engine/runtime:runpod
    container_name: cosmic-runpod-runtime
    depends_on:
      - ray-head
    profiles: ["dedicated-runtime"]
    environment:
      COSMIC_ROLE: runtime
      COSMIC_RAY_ADDRESS: "ray-head:6379"
      COSMIC_HEAD_IP: ray-head
      COSMIC_HEAD_PORT: "6379"
      COSMIC_RUNTIME_HOST: "0.0.0.0"
      COSMIC_RUNTIME_PORT: "8765"
      COSMIC_DATA_DIR: /workspace/data
      COSMIC_MODEL_DIR: /workspace/models
      COSMIC_OUTPUT_DIR: /workspace/outputs
      COSMIC_NODE_NAME: runtime
    ports:
      - "18765:8765"
    volumes:
      - ./data:/workspace/data
      - ./models:/workspace/models
      - ./outputs:/workspace/outputs

  # ----------------------------------------------------------------
  # AI Viewer client
  # ----------------------------------------------------------------
  viewer:
    build:
      context: ../..
      dockerfile: deploy/runpod/docker/Dockerfile.viewer
    image: cosmic-engine/viewer:runpod
    container_name: cosmic-runpod-viewer
    depends_on:
      - ray-head
    environment:
      COSMIC_ROLE: viewer
      COSMIC_HEAD_IP: ray-head
      COSMIC_RUNTIME_PORT: "8765"
      COSMIC_OUTPUT_DIR: /workspace/outputs
    volumes:
      - ./outputs:/workspace/outputs
